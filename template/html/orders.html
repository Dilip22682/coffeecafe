{% extends 'html/base.html' %}

{% block content %}

<div class="container mt-5">

<h2 class="mb-4">📦 Your Orders</h2>

<table class="table table-bordered">

<tr>
<th>Order ID</th>
<th>Payment</th>
<th>Total</th>
<th>Date</th>
</tr>

{% for order in orders %}

<tr>

<td>#{{ order.id }}</td>

<td>{{ order.payment_method }}</td>

<td>₹ {{ order.total_amount }}</td>

<td>{{ order.created_at }}</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
