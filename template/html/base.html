<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilip Coffee Cafe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <!-- Brand -->
            {% block name %}
            <a href="{% url 'coffee' %}" class="navbar-brand fw-bold fs-4">
                ☕ Dilip Coffee Cafe
            </a>
            {% endblock %}

            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <!-- Menu Links -->

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="btn btn-light btn-sm me-2" href="{% url 'coffee' %}">
                            🏠 Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-light btn-sm me-2" href="{% url 'coffee' %}">
                            ☕ Coffee
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-light btn-sm me-2" href="{% url 'orders' %}">
                            📦 Orders
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="btn btn-light btn-sm me-2" href="{% url 'cart' %}">

                            🛒 Cart

                            <span class="badge bg-warning text-dark ms-1">
                                ({{ cart_count }})
                            </span>

                        </a>
                    </li>

                </ul>

                <!-- Search -->

                <form method="POST" action="{% url 'search_data' %}" class="d-flex mx-auto">

                    {% csrf_token %}

                    <input type="text" name="q" class="form-control me-2" placeholder="Search coffee...">

                    <button class="btn btn-success">
                        Search
                    </button>

                </form>

                <!-- Authentication -->

                <div class="d-flex align-items-center">

                    {% if user.is_authenticated %}

                    <span class="text-white me-3">
                        👤 {{ user.username }}
                    </span>

                    <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
                        Logout
                    </a>

                    {% else %}

                    <a href="{% url 'login' %}" class="btn btn-light btn-sm me-2">
                        Login
                    </a>

                    <a href="{% url 'register' %}" class="btn btn-warning btn-sm">
                        Register
                    </a>

                    {% endif %}

                </div>

            </div>

        </div>

    </nav>

    <!-- Page Content -->

    <div class="container mt-4">

        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
